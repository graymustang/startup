<!DOCTYPE html>


<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golf Tracker</title>
    <link rel="stylesheet" href="css/css.css">
    <link rel="icon" type="image/x-icon" href="css/Bjorn-Gray-profile-picture.jpg">
</head>

<body>
    <main>
        <div class="floating-box">
            <div class="button-container">
                <a href="#" class="btn" data-nav="home">Home</a>
                <a href="#" class="btn" data-nav="log-round">Log a Round</a>
                <a href="#" class="btn" data-nav="stats">Stats</a>
                <a href="#" class="btn" data-nav="find-course">Find a course</a>
                <a href="#" class="btn" data-nav="gallery">Photo Gallery</a>
                <a href="https://youthoncourse.org" target="_blank" class="btn">Youth on Course</a>
                <a href="#" class="btn" data-nav="contact">About/Contact</a>
                <a href="#" class="btn" data-nav="log-visit">Visitor Registration</a>
            </div>
        </div>
        <!--Home section-->
        <section data-section="home">
            <div class="floating-box">

                <div class="flex-container">
                    <img src="img/golf-ball-tee.jpg" alt="Golf Ball" class="flex-image">

                    <div class="flex-text">
                        <h1>Track your game</h1>
                        <h1>Lower your scores</h1>
                        <p>By Bjorn Gray</p>
                    </div>
                </div>



                <hr>

                <div class="button-stats-container">
                    <div class="quick-stats">
                        <h2>Quick Stats</h2>
                        <p><strong>Avg Score:</strong> 75</p>
                        <p><strong>Fairways:</strong> 75%</p>
                        <p><strong>Putts Avg:</strong> 34</p>
                    </div>
                </div>

                <div class="video-container">
                    <iframe width="1840" height="1000" src="https://www.youtube.com/embed/gLeW6MNoB4U"
                        title="1 Pro vs 5 Average Golfers (Not Even Close)" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>

                <aside class="weather-container">
                    <h2>Weather Warning</h2>
                    <div class="weather-text">
                        Snowstorms in the area, book earlier tee times...
                    </div>
                    <a href="https://weather.com/weather/today/l/4f9c2cccc24c9501d3ec21022cc060ea99dc40a0bca3c62398d61f6be6620f8c"
                        target="_blank" class="btn">
                        Weather in Orem
                    </a>
                </aside>

            </div> <!--floating-box-->
        </section>
    </main>
</body>

</html>
