<!DOCTYPE html>

<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roundly - Gallery</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Roundly</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="round.html">Log a Round</a>
            <a href="stats.html">Stats</a>
            <a href="courses.html">Find a Course</a>
            <a href="gallery.html">Photo Gallery</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>
        <section id="gallery">
            <h2>Photo Gallery</h2>

            <p>Photos from golf courses and rounds will be displayed here.</p>

            <div class="gallery-container">

                <figure class="gallery-item">
                    <img src="img/sleepy-ridge.jpg" alt="Sleepy Ridge Course">
                    <figcaption>Sleepy Ridge</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="img/red-rock-golf-trail.jpg" alt="Red Rock Golf Trail">
                    <figcaption>Red Rock Golf Trail</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="img/riverside-golf-course.jpg" alt="Riverside green">
                    <figcaption>Riverside Country Club</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="img/timp-golf-course.jpg" alt="Timp Golf Course">
                    <figcaption>Pond at Timpanogos Golf Course</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="img/sunset-fox-hollow.webp" alt="Fox Hollow">
                    <figcaption>Sunset at Fox Hollow</figcaption>
                </figure>

            </div>
        </section>
    </main>

    <footer>
        Bjorn Gray | GitHub:
        <a href="https://github.com/graymustang/startup" target="_blank">
