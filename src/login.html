<!DOCTYPE html>

<html lang="en">

<!--Placeholder for login for now-->

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roundly - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="site-header">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">

                <a class="navbar-brand" href="index.html">Roundly</a>

                <div class="navbar-nav">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="round.html">Log a Round</a>
                    <a class="nav-link" href="stats.html">Stats</a>
                    <a class="nav-link" href="courses.html">Find a Course</a>
                    <a class="nav-link" href="gallery.html">Photo Gallery</a>
                    <a class="nav-link" href="login.html">Login</a>
                </div>

            </div>
        </nav>
    </header>
    <main class="login-page">

        <div class="login-card">
            <h2>Login</h2>

            <form class="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password:</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password">
                </div>

                <button type="submit" class="btn btn-success">Login</button>
                <button type="button" class="btn btn-outline-success">Create Account</button>
            </form>

            <div class="current-user">
                <h3>Current User</h3>
                <p>Logged in as: <span>Username</span></p>
            </div>
        </div>

    </main>

    <footer>
        Bjorn Gray |
        GitHub:
        <a href="https://github.com/graymustang/startup" target="_blank">
            https://github.com/graymustang/startup
        </a>
    </footer>

</body>

</html>
